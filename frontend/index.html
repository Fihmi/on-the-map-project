<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/images/icon-sast.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveland-Trips</title>

  <!-- Preload Critical Resources -->
  <link rel="modulepreload" href="/src/main.tsx" />
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1539020140153-e479b8c22e70?auto=format&fit=crop&w=1920&q=80" />

  <!-- Critical CSS to avoid flash of unstyled content (FOUC) and style raw body -->
  <style>
    html, body {
      background-color: #0a0f1c;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    #root:empty::after {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #ea580c;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx" async></script>
</body>

</html>
