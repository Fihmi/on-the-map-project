<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Discover the magic of Tunisia with Traveland-Trips. Explore curated travel packages to ancient medinas, Mediterranean beaches, and the Sahara desert." />
  <meta name="theme-color" content="#0a0f1c" />
  <title>Traveland-Trips — Explore Tunisia</title>
  <link rel="icon" type="image/png" href="/images/icon-sast.png" />

  <!--
    ┌─ PRECONNECT ──────────────────────────────────────────────────────────────┐
    │ Opens the TCP+TLS handshake to every third-party origin we fetch from     │
    │ during the page lifetime so the sockets are warm before the JS runs.      │
    │ dns-prefetch is the graceful fallback for browsers that ignore preconnect.│
    └───────────────────────────────────────────────────────────────────────────┘
  -->
  <!-- Unsplash — hero poster, decorative background images -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin="anonymous" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- CartoCDN — Leaflet tile layer (four subdomains: a/b/c/d) -->
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin="anonymous" />
  <link rel="dns-prefetch" href="https://basemaps.cartocdn.com" />

  <!--
    ┌─ PRELOAD ─────────────────────────────────────────────────────────────────┐
    │ Kicks off fetches for LCP / above-the-fold assets at the highest browser  │
    │ priority, before the parser even reaches the <body>.                      │
    └───────────────────────────────────────────────────────────────────────────┘
  -->
  <!-- Hero video poster — shown immediately while the video loads -->
  <link rel="preload" as="image"
        href="https://images.unsplash.com/photo-1539020140153-e479b8c22e70?auto=format&fit=crop&w=1920&q=80"
        crossorigin="anonymous" />

  <!-- Favicon — small; preloading avoids a separate late-stage DNS lookup -->
  <link rel="preload" as="image" href="/images/icon-sast.png" />

  <!--
    ┌─ PREFETCH ────────────────────────────────────────────────────────────────┐
    │ Tunisia GeoJSON is not needed on first paint but is fetched the moment    │
    │ the map component mounts. Prefetching it during idle time eliminates the  │
    │ round-trip latency that would otherwise delay the overlay rendering.      │
    └───────────────────────────────────────────────────────────────────────────┘
  -->
  <link rel="prefetch" href="/tunisia.json" as="fetch" crossorigin="anonymous" />

  <!-- Critical CSS: prevents FOUC and provides the dark base shell + loading spinner
       before the JS bundle and Tailwind styles have loaded -->
  <style>
    html, body {
      background-color: #0a0f1c;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    #root:empty::after {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #ea580c;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <!--
    ES module scripts are deferred by spec — the `async` attribute has no effect
    on type="module" and has been removed to avoid confusion.
  -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
